<mat-toolbar class="bg-mainbg! flex justify-between">
  <div class="flex gap-3 items-center">
    <div class="w-[50px] h-[50px] overflow-hidden">
      <img class="" src="logo.png" alt="" />
    </div>
    <a
      class="text-lg lg sm:text-xl font-semibold py-1 w-[80px] rounded text-center cursor-pointer border hover:border-btnporder border-disbtnporder transition duration-custom"
      routerLink="/home"
      >Home</a
    >
  </div>

  <input
    type="text "
    placeholder="Search Your Movie"
    class="bg-white px-2 py-1 rounded-lg w-[50%] sm:w-[40%] md:w-[30%] outline-0"
    [(ngModel)]="searchString"
    (input)="onInput()"
  />
</mat-toolbar>
