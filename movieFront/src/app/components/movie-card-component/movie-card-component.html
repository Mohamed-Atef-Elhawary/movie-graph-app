<mat-card class="h-[700px] md:h-[600px]" appearance="outlined">
  <img
    mat-card-image
    class="h-[70%] md:h-[60%]"
    src="{{ applyPoster() }}"
    alt="{{ movieInput().title }}"
  />
  <mat-card-content class="pt-2! overflow-hidden grow">
    <h3 class="text-2xl text-gray-900">
      <span class="font-bold text-gray-600">title: </span>{{ movieInput().title }}
    </h3>
    <h3 class="text-2xl text-gray-500">
      <span class="font-bold text-gray-600">Year: </span>{{ movieInput().year }}
    </h3>
    <h3 class="text-2xl text-indigo-600">
      <span class="font-bold text-gray-600">Type: </span>{{ movieInput().rating }}
    </h3>
  </mat-card-content>

  <mat-card-actions>
    <button
      matButton
      [routerLink]="['/details', movieInput().id]"
      class="rounded-none! w-full! border! text-indego-700!"
    >
      More Details
    </button>
  </mat-card-actions>
</mat-card>
